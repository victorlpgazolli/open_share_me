name: Unified Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish-github:
        type: boolean
        description: 'Publish to GitHub Release'
        default: true

jobs:
  setup-release:
    name: Setup Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update version.txt
        if: github.event_name != 'workflow_dispatch'
        env:
          COMMIT_MESSAGE: "chore: update version.txt with release ${{ github.ref_name }}"
          VERSION: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "${VERSION}" > version.txt
          git add ./version.txt
          git diff --cached --quiet || git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:master

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${RELEASE_TAG} \
            --title "${RELEASE_TAG}" \
            --generate-notes

      - name: Export release tag
        id: release
        shell: bash
        run: echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Export version
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-snapshot"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-15
    needs: setup-release
    if: ${{ vars.MACOS_IS_SUPPORTED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.build-macos-arm64 == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build macOS ARM64
        uses: ./.github/actions/build-macos

  publish-github:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs: [setup-release, build-macos-arm64]
    if: |
      !failure() &&
      (github.event_name == 'workflow_dispatch' && inputs.publish-github == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: ./.github/actions/publish-to-platform
        with:
          platform: github
          artifacts-dir: artifacts
